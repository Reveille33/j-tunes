name: Release

on:
  push:
    tags: ['v*']
  # Run the Mac packager without tagging. The workflow file must be on the
  # default branch before GitHub will accept workflow_dispatch.
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    # The Windows installer stays tag-only. pull_request and workflow_dispatch
    # exist so the Mac job can be proven without a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build installers
        env:
          # Optional Authenticode signing. Add these repository secrets to sign
          # the build; without them electron-builder emits unsigned installers
          # (which Windows SmartScreen will warn about).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: j-tunes-windows
          path: release/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Package unsigned Mac builds
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      - name: Check better-sqlite3 arch
        run: sh scripts/verify-mac-sqlite.sh release

      - name: Upload Mac artifacts
        uses: actions/upload-artifact@v4
        with:
          name: j-tunes-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
