name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Build installers
        env:
          # Optional Authenticode signing. Add these repository secrets to sign
          # the build; without them electron-builder emits unsigned installers
          # (which Windows SmartScreen will warn about).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: j-tunes-windows
          path: release/*.exe
          if-no-files-found: error